name: Android startup
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - downloads/android/MDReader.apk
      - scripts/Test-Android-Startup.sh
      - .github/workflows/android-startup.yml
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch distributed APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 300
          script: bash scripts/Test-Android-Startup.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-startup-diagnostics-API-${{ matrix.api-level }}
          path: artifacts/android-startup/
